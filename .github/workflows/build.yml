name: Build TWRP recovery (X01A)

on:
  workflow_dispatch:

env:
  DEVICE: X01A
  VENDOR: kyocera
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  BRANCH: twrp-12.1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: tree

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm /usr/local/julia* /opt/microsoft /usr/share/miniconda "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get -y autoremove --purge || true
          sudo apt-get clean
          df -h /
          AVAIL=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free space: ${AVAIL} GB"
          if [ "$AVAIL" -lt 60 ]; then
            echo "::error::Only ${AVAIL} GB free (need 60 GB)"
            exit 1
          fi

      - name: Install AOSP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig \
            libncurses5 bc lz4 rsync python3 python-is-python3 libssl-dev ccache
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "twrp-ci"
          git config --global user.email "twrp-ci@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync TWRP minimal manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          ~/bin/repo init --depth=1 -u "$MANIFEST" -b "$BRANCH"
          ~/bin/repo sync -c --depth=1 --no-tags -j4 --force-sync
          df -h /

      - name: Copy device tree
        run: |
          mkdir -p ~/twrp/device/$VENDOR/$DEVICE
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' \
            "$GITHUB_WORKSPACE/tree/" ~/twrp/device/$VENDOR/$DEVICE/
          ls -la ~/twrp/device/$VENDOR/$DEVICE

      - name: Build recovery image
        run: |
          cd ~/twrp
          set +u
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch twrp_${DEVICE}-eng
          mka recoveryimage 2>&1 | tee ~/build.log

      - name: Show output
        if: always()
        run: ls -la ~/twrp/out/target/product/$DEVICE/ || true

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ env.DEVICE }}
          path: ~/twrp/out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/build.log
            ~/twrp/out/error.log
          if-no-files-found: ignore
